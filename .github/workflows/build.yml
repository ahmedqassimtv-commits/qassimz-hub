name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP '^VERSION = "\K[^"]+' app/server.py)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build React + TypeScript + Tailwind frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Install Playwright (E2E harness)
        run: |
          python -m pip install playwright
          python -m playwright install chromium

      - name: Run E2E harness tests
        run: python -m unittest discover -s e2e_tests -v

      - name: Build Windows executable (PyInstaller)
        run: python -m PyInstaller --noconfirm --clean qassimz-hub.spec

      - name: Install Inno Setup & Arabic language file
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $inno = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          $found = Get-ChildItem -Path $inno -Recurse -Filter "Arabic.isl" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) { Copy-Item $found.FullName installer/Arabic.isl } else {
            foreach ($u in @("https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Arabic.isl",
                             "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Arabic.isl")) {
              try { Invoke-WebRequest $u -OutFile installer/Arabic.isl -UseBasicParsing -ErrorAction Stop; break } catch {}
            }
          }

      - name: Build Windows Setup (.exe), Portable (.zip) & Delta (.qpkg)
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=${{ needs.version.outputs.ver }}" installer\setup.iss
          Compress-Archive -Path "dist\QASSIMZ Hub\*" -DestinationPath "dist\QASSIMZ-Hub-Portable.zip" -Force
          python tools/qpkg_packager.py pack --input "dist\QASSIMZ Hub" --output-dir "dist\delta" --app-id "qassimz-hub" --version "${{ needs.version.outputs.ver }}"
          python tools/qpkg_packager.py verify --manifest "dist\delta\manifest.json" --qpkg "dist\delta\qassimz-hub-v${{ needs.version.outputs.ver }}.qpkg"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: QASSIMZ-Hub
          path: |
            dist/QASSIMZ-Hub-Setup-*.exe
            dist/QASSIMZ-Hub-Portable.zip
            dist/delta/manifest.json
            dist/delta/*.qpkg

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "QASSIMZ Hub ${{ needs.version.outputs.tag }}"
          make_latest: true
          body: |
            ## QASSIMZ Hub ${{ needs.version.outputs.tag }} — اللانشر والمركز الرسمي لمنظومة قَاسِمز
            - **QASSIMZ-Hub-Setup-${{ needs.version.outputs.ver }}.exe**: معالج التثبيت الرسمي لنظام Windows 10/11 x64 (موصى به — يدعم التحديث التفاضلي التلقائي).
            - **QASSIMZ-Hub-Portable.zip**: النسخة المحمولة بدون تثبيت.
            - **manifest.json + qassimz-hub-v${{ needs.version.outputs.ver }}.qpkg**: حزمة التحديث التفاضلي الذكي (Delta Update).
          files: |
            dist/QASSIMZ-Hub-Setup-*.exe
            dist/QASSIMZ-Hub-Portable.zip
            dist/delta/manifest.json
            dist/delta/*.qpkg
            catalog.json
