<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ccCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#375117"/>
      <stop offset="55%" stop-color="#283B13"/>
      <stop offset="100%" stop-color="#28320D"/>
    </linearGradient>

    <radialGradient id="ccWash" cx="80%" cy="88%" r="68%">
      <stop offset="0%" stop-color="#C8FF00" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D2FE39"/>
      <stop offset="100%" stop-color="#B9F405"/>
    </linearGradient>

    <linearGradient id="monoInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D7FE55"/>
      <stop offset="48%" stop-color="#C8FF00"/>
      <stop offset="100%" stop-color="#C8FF00"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="14" y="14" width="996" height="996" rx="222"/>
    </clipPath>
  </defs>

  <!-- Clipped Adobe CC x ArtCraft interior -->
  <g clip-path="url(#squircleClip)">
    <rect x="14" y="14" width="996" height="996" fill="url(#ccCore)"/>
    <rect x="14" y="14" width="996" height="996" fill="url(#ccWash)"/>
    <g>
      <line x1="208" y1="24" x2="208" y2="1000" stroke="#ECFCCB" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="208" x2="1000" y2="208" stroke="#ECFCCB" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="360" y1="24" x2="360" y2="1000" stroke="#ECFCCB" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="360" x2="1000" y2="360" stroke="#ECFCCB" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="512" y1="24" x2="512" y2="1000" stroke="#ECFCCB" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="512" x2="1000" y2="512" stroke="#ECFCCB" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="664" y1="24" x2="664" y2="1000" stroke="#ECFCCB" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="664" x2="1000" y2="664" stroke="#ECFCCB" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="816" y1="24" x2="816" y2="1000" stroke="#ECFCCB" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="816" x2="1000" y2="816" stroke="#ECFCCB" stroke-opacity="0.045" stroke-width="2"/>
    </g>
    <!-- Crisp flat Adobe CC colored frame inside the squircle -->
    <rect x="28" y="28" width="968" height="968" rx="208"
          fill="none" stroke="url(#rimInk)" stroke-width="28"/>
    <!-- Fine drafted architectural inner hairline -->
    <rect x="44" y="44" width="936" height="936" rx="192"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  </g>

  <!-- Crisp ArtCraft drafted ink outer boundary (ensures razor-sharp contrast on #F2F1EE paper) -->
  <rect x="14" y="14" width="996" height="996" rx="222"
        fill="none" stroke="#101014" stroke-opacity="0.88" stroke-width="8"/>

  <!-- Harmonized architectural mini functional symbol cell (top-right) -->
  <g transform="translate(796, 216)">
    <rect x="-100" y="-100" width="200" height="200" rx="44"
          fill="#2E4315" stroke="#C8FF00" stroke-opacity="0.62" stroke-width="6"/>
    <rect x="-92" y="-92" width="184" height="184" rx="37"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2.5"/>
    <g transform="scale(1.28)">
      <rect x="-46" y="-8" width="68" height="24" rx="6" transform="rotate(-28 -12 4)" fill="#C8FF00" opacity="0.92"/>
        <path d="M26 -46 L33 -26 L52 -19 L33 -12 L26 8 L19 -12 L0 -19 L19 -26 Z" fill="#ECFCCB"/>
        <line x1="-36" y1="38" x2="34" y2="38" stroke="#ECFCCB" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

