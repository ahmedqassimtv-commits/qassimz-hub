      <path d="M709 -3Q702 -3 696.5 0.5Q691 4 685 10L406 468L351 471L4 1003Q-9 1017 -2.0 1033.0Q5 1049 23 1049H336Q345 1049 351.5 1044.5Q358 1040 363 1034L630 586L695 582L1036 44Q1049 29 1042.0 13.0Q1035 -3 1017 -3ZM17 -3Q0 -3 -7.0 11.5Q-14 26 -1 41L339 590L426 595L685 1035Q690 1040 696.5 1044.5Q703 1049 710 1049H1003Q1020 1049 1026.0 1034.0Q1032 1019 1019 1005L677 467L588 461L324 8Q319 3 314.0 0.0Q309 -3 303 -3Z" transform="translate(476.74,792.00) scale(0.30278,-0.30278)"/>
