<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep obsidian dark interior -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="52%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>

    <!-- Signature ambient corner glow -->
    <radialGradient id="ambientBR" cx="82%" cy="86%" r="72%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#16A34A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientTL" cx="18%" cy="12%" r="58%">
      <stop offset="0%" stop-color="#BBF7D0" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing border gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BBF7D0"/>
      <stop offset="45%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>

    <!-- Luminous 2-letter monogram fill -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BBF7D0"/>
      <stop offset="42%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Outer & inner rim neon glow -->
    <filter id="rimGlow" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="40" y="40" width="944" height="944" rx="212"/>
    </clipPath>
  </defs>

  <!-- Soft outer neon halo -->
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="none" stroke="#22C55E" stroke-width="34" stroke-opacity="0.42" filter="url(#rimGlow)"/>

  <!-- Clipped dark tile interior -->
  <g clip-path="url(#tileClip)">
    <rect x="40" y="40" width="944" height="944" fill="url(#bgGrad)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#ambientBR)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#ambientTL)"/>
    <!-- Subtle inner glass sheen -->
    <rect x="64" y="64" width="896" height="896" rx="190"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="4"/>
  </g>

  <!-- Crisp glowing colored border -->
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="none" stroke="url(#rimGrad)" stroke-width="26"/>
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="none" stroke="#BBF7D0" stroke-opacity="0.55" stroke-width="5"/>

  <!-- Mini functional symbol badge (top-right) -->
  <g transform="translate(792, 218)">
    <rect x="-102" y="-102" width="204" height="204" rx="56"
          fill="#0C1018" fill-opacity="0.92" stroke="#22C55E" stroke-opacity="0.52" stroke-width="6.5"/>
    <g transform="scale(1.30)">
      
        <path d="M10 -42 H42 V-10" fill="none" stroke="#22C55E" stroke-width="10.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="-6" y1="6" x2="40" y2="-40" stroke="#22C55E" stroke-width="10.5" stroke-linecap="round"/>
        <path d="M42 14 V34 C42 41 37 46 30 46 H-34 C-41 46 -46 41 -46 34 V-30 C-46 -37 -41 -42 -34 -42 H-14" fill="none" stroke="#BBF7D0" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
        
    </g>
  </g>

  <!-- Prominent 2-letter Adobe-style monogram -->
  <g fill="url(#textGrad)" filter="url(#textShadow)">
      <path d="M139 0Q124 0 113.0 11.0Q102 22 102 37V1395Q102 1410 113.0 1421.0Q124 1432 139 1432H1014Q1026 1432 1034.5 1423.5Q1043 1415 1043 1404V1144Q1043 1133 1034.5 1124.5Q1026 1116 1014 1116H472V312H1021Q1033 312 1041.5 304.0Q1050 296 1050 284V28Q1050 17 1041.5 8.5Q1033 0 1021 0ZM347 578V858H978Q988 858 995.5 850.5Q1003 843 1003 833V603Q1003 592 995.5 585.0Q988 578 978 578Z" transform="translate(91.12,792.00) scale(0.30278,-0.30278)"/>
      <path d="M768 -3Q762 -3 756.0 0.0Q750 3 745 9L434 468L383 473L4 1000Q-10 1015 -3.0 1032.0Q4 1049 24 1049H353Q363 1049 369.0 1044.5Q375 1040 380 1034L679 582L739 578L1109 46Q1124 31 1116.5 14.0Q1109 -3 1090 -3ZM16 -3Q-2 -3 -9.0 13.0Q-16 29 -1 43L369 584L452 591L742 1035Q747 1040 753.5 1044.5Q760 1049 767 1049H1075Q1093 1049 1099.0 1032.5Q1105 1016 1091 1002L719 469L631 461L337 7Q332 2 327.0 -0.5Q322 -3 316 -3Z" transform="translate(417.77,792.00) scale(0.30278,-0.30278)"/>
  </g>
</svg>
