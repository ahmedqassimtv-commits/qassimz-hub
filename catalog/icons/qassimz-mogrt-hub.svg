<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ccCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#541838"/>
      <stop offset="55%" stop-color="#3D132A"/>
      <stop offset="100%" stop-color="#2D1525"/>
    </linearGradient>

    <radialGradient id="ccWash" cx="80%" cy="88%" r="68%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F06EAF"/>
      <stop offset="100%" stop-color="#E84192"/>
    </linearGradient>

    <linearGradient id="monoInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F281BA"/>
      <stop offset="48%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="14" y="14" width="996" height="996" rx="222"/>
    </clipPath>
  </defs>

  <!-- Clipped Adobe CC x ArtCraft interior -->
  <g clip-path="url(#squircleClip)">
    <rect x="14" y="14" width="996" height="996" fill="url(#ccCore)"/>
    <rect x="14" y="14" width="996" height="996" fill="url(#ccWash)"/>
    <g>
      <line x1="208" y1="24" x2="208" y2="1000" stroke="#FBCFE8" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="208" x2="1000" y2="208" stroke="#FBCFE8" stroke-opacity="0.045" stroke-width="2"/>
