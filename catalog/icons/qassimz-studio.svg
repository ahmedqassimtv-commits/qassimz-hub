<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ccCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2F46"/>
      <stop offset="55%" stop-color="#092334"/>
      <stop offset="100%" stop-color="#0A2432"/>
    </linearGradient>

    <radialGradient id="ccWash" cx="80%" cy="88%" r="68%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3EB7EF"/>
      <stop offset="100%" stop-color="#0C98D9"/>
    </linearGradient>

    <linearGradient id="monoInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#56C0F1"/>
      <stop offset="48%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="14" y="14" width="996" height="996" rx="222"/>
    </clipPath>
  </defs>

  <!-- Clipped Adobe CC x ArtCraft interior -->
  <g clip-path="url(#squircleClip)">
