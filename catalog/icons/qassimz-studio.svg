      <line x1="664" y1="24" x2="664" y2="1000" stroke="#BAE6FD" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="664" x2="1000" y2="664" stroke="#BAE6FD" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="816" y1="24" x2="816" y2="1000" stroke="#BAE6FD" stroke-opacity="0.045" stroke-width="2"/>
      <line x1="24" y1="816" x2="1000" y2="816" stroke="#BAE6FD" stroke-opacity="0.045" stroke-width="2"/>
    </g>
    <!-- Crisp flat Adobe CC colored frame inside the squircle -->
    <rect x="28" y="28" width="968" height="968" rx="208"
          fill="none" stroke="url(#rimInk)" stroke-width="28"/>
    <!-- Fine drafted architectural inner hairline -->
    <rect x="44" y="44" width="936" height="936" rx="192"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  </g>

  <!-- Crisp ArtCraft drafted ink outer boundary (ensures razor-sharp contrast on #F2F1EE paper) -->
  <rect x="14" y="14" width="996" height="996" rx="222"
        fill="none" stroke="#101014" stroke-opacity="0.88" stroke-width="8"/>

  <!-- Harmonized architectural mini functional symbol cell (top-right) -->
