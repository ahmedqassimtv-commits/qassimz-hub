        <rect x="-38" y="-26" width="44" height="20" rx="6" fill="#0EA5E9" opacity="0.9"/>
        <rect x="-12" y="10" width="54" height="20" rx="6" fill="none" stroke="#BAE6FD" stroke-width="8"/>
        <line x1="6" y1="-44" x2="6" y2="46" stroke="#0EA5E9" stroke-width="8.5" stroke-linecap="round"/>
        <polygon points="6,-50 18,-38 6,-26 -6,-38" fill="#0EA5E9"/>
    </g>
  </g>

