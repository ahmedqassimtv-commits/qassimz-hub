<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep obsidian dark interior -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="52%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>

    <!-- Signature ambient corner glow -->
    <radialGradient id="ambientBR" cx="82%" cy="86%" r="72%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientTL" cx="18%" cy="12%" r="58%">
      <stop offset="0%" stop-color="#BFDBFE" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing border gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFDBFE"/>
      <stop offset="45%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Luminous 2-letter monogram fill -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BFDBFE"/>
      <stop offset="42%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Outer & inner rim neon glow -->
    <filter id="rimGlow" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="40" y="40" width="944" height="944" rx="212"/>
    </clipPath>
  </defs>

  <!-- Soft outer neon halo -->
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="none" stroke="#3B82F6" stroke-width="34" stroke-opacity="0.42" filter="url(#rimGlow)"/>

  <!-- Clipped dark tile interior -->
  <g clip-path="url(#tileClip)">
    <rect x="40" y="40" width="944" height="944" fill="url(#bgGrad)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#ambientBR)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#ambientTL)"/>
    <!-- Subtle inner glass sheen -->
    <rect x="64" y="64" width="896" height="896" rx="190"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="4"/>
  </g>

  <!-- Crisp glowing colored border -->
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="none" stroke="url(#rimGrad)" stroke-width="26"/>
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="none" stroke="#BFDBFE" stroke-opacity="0.55" stroke-width="5"/>

  <!-- Mini functional symbol badge (top-right) -->
  <g transform="translate(792, 218)">
    <rect x="-102" y="-102" width="204" height="204" rx="56"
          fill="#0C1018" fill-opacity="0.92" stroke="#3B82F6" stroke-opacity="0.52" stroke-width="6.5"/>
    <g transform="scale(1.30)">
      
        <line x1="0" y1="-46" x2="0" y2="18" stroke="#BFDBFE" stroke-width="11" stroke-linecap="round"/>
        <path d="M-26 -6 L0 20 L26 -6" fill="none" stroke="#BFDBFE" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M-44 24 V38 C-44 43 -40 46 -34 46 H34 C40 46 44 43 44 38 V24" fill="none" stroke="#3B82F6" stroke-width="9.5" stroke-linecap="round"/>
        
    </g>
  </g>

  <!-- Prominent 2-letter Adobe-style monogram -->
  <g fill="url(#textGrad)" filter="url(#textShadow)">
      <path d="M721 -26Q428 -26 235.5 170.0Q43 366 43 677V757Q43 1068 236.0 1263.0Q429 1458 721 1458Q1013 1458 1206.5 1261.0Q1400 1064 1400 757V677Q1400 370 1206.5 172.0Q1013 -26 721 -26ZM721 328Q856 328 944.0 419.0Q1032 510 1032 653V780Q1032 924 944.0 1014.5Q856 1105 721 1105Q586 1105 498.5 1014.5Q411 924 411 780V653Q411 509 498.0 418.5Q585 328 721 328ZM1119 -157Q1110 -163 1098.0 -161.0Q1086 -159 1079 -149L844 201Q837 211 839.0 222.5Q841 234 851 241L1066 382Q1076 388 1087.5 385.5Q1099 383 1106 374L1341 27Q1348 18 1346.0 6.0Q1344 -6 1334 -12Z" transform="translate(102.98,792.00) scale(0.30278,-0.30278)"/>
      <path d="M465 -25Q278 -25 156.5 112.5Q35 250 35 495V553Q35 790 158.0 930.5Q281 1071 472 1071Q567 1071 640.5 1035.0Q714 999 754 940L746 933L745 1405Q745 1418 754.0 1426.5Q763 1435 775 1435H1046Q1058 1435 1067.0 1426.5Q1076 1418 1076 1405V25Q1076 14 1067.5 5.5Q1059 -3 1047 -3H794Q783 -3 775.0 4.0Q767 11 767 21V175L817 126H768Q724 55 645.5 15.0Q567 -25 465 -25ZM560 263Q644 263 698.0 325.5Q752 388 752 487V558Q752 658 697.5 719.0Q643 780 561 780Q476 780 422.5 720.0Q369 660 369 557V487Q369 381 423.0 322.0Q477 263 560 263Z" transform="translate(524.60,792.00) scale(0.30278,-0.30278)"/>
  </g>
</svg>
