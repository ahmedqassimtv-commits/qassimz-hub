<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ccCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B3853"/>
      <stop offset="55%" stop-color="#092A3D"/>
      <stop offset="100%" stop-color="#112734"/>
    </linearGradient>

    <radialGradient id="ccWash" cx="80%" cy="88%" r="68%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5CC8F9"/>
      <stop offset="100%" stop-color="#2CB0ED"/>
    </linearGradient>

    <linearGradient id="monoInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6FCEFA"/>
      <stop offset="48%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="14" y="14" width="996" height="996" rx="222"/>
    </clipPath>
  </defs>

  <!-- Clipped Adobe CC x ArtCraft interior -->
  <g clip-path="url(#squircleClip)">
    <rect x="14" y="14" width="996" height="996" fill="url(#ccCore)"/>
    <rect x="14" y="14" width="996" height="996" fill="url(#ccWash)"/>
