        <rect x="-48" y="10" width="38" height="38" rx="10" fill="none" stroke="#BAE6FD" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="10" y="10" width="38" height="38" rx="10" fill="none" stroke="#BAE6FD" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="13" y="-45" width="32" height="32" rx="8" transform="rotate(45 29 -29)" fill="#38BDF8" stroke="#BAE6FD" stroke-width="6"/>
    </g>
  </g>

