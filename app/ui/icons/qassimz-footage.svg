<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ccCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D3D4C"/>
      <stop offset="55%" stop-color="#0A2D38"/>
      <stop offset="100%" stop-color="#09262F"/>
    </linearGradient>

    <radialGradient id="ccWash" cx="80%" cy="88%" r="68%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33C7DF"/>
      <stop offset="100%" stop-color="#06AECD"/>
    </linearGradient>

    <linearGradient id="monoInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#49D0E5"/>
      <stop offset="48%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <clipPath id="squircleClip">
      <rect x="14" y="14" width="996" height="996" rx="222"/>
    </clipPath>
  </defs>

  <!-- Clipped Adobe CC x ArtCraft interior -->
  <g clip-path="url(#squircleClip)">
