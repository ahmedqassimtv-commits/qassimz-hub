<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep obsidian dark interior -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141821"/>
      <stop offset="52%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>

    <!-- Signature ambient corner glow -->
    <radialGradient id="ambientBR" cx="82%" cy="86%" r="72%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#CA8A04" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="ambientTL" cx="18%" cy="12%" r="58%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glowing border gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="45%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Luminous 2-letter monogram fill -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="42%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>

    <!-- Outer & inner rim neon glow -->
    <filter id="rimGlow" x="-12%" y="-12%" width="124%" height="124%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
    </filter>

    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="40" y="40" width="944" height="944" rx="212"/>
    </clipPath>
  </defs>

  <!-- Soft outer neon halo -->
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="none" stroke="#EAB308" stroke-width="34" stroke-opacity="0.42" filter="url(#rimGlow)"/>

  <!-- Clipped dark tile interior -->
  <g clip-path="url(#tileClip)">
    <rect x="40" y="40" width="944" height="944" fill="url(#bgGrad)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#ambientBR)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#ambientTL)"/>
    <!-- Subtle inner glass sheen -->
    <rect x="64" y="64" width="896" height="896" rx="190"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="4"/>
  </g>

  <!-- Crisp glowing colored border -->
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="none" stroke="url(#rimGrad)" stroke-width="26"/>
  <rect x="40" y="40" width="944" height="944" rx="212"
        fill="none" stroke="#FEF08A" stroke-opacity="0.55" stroke-width="5"/>

  <!-- Mini functional symbol badge (top-right) -->
  <g transform="translate(792, 218)">
    <rect x="-102" y="-102" width="204" height="204" rx="56"
          fill="#0C1018" fill-opacity="0.92" stroke="#EAB308" stroke-opacity="0.52" stroke-width="6.5"/>
    <g transform="scale(1.30)">
      
        <path d="M-46 -36 H46 C51 -36 54 -32 54 -26 V18 C54 24 51 28 46 28 H-8 L-28 46 V28 H-46 C-51 28 -54 24 -54 18 V-26 C-54 -32 -51 -36 -46 -36 Z" fill="none" stroke="#FEF08A" stroke-width="8.5" stroke-linejoin="round"/>
        <line x1="-30" y1="-12" x2="30" y2="-12" stroke="#EAB308" stroke-width="9" stroke-linecap="round"/>
        <line x1="-30" y1="8" x2="12" y2="8" stroke="#EAB308" stroke-width="9" stroke-linecap="round"/>
        
    </g>
  </g>

  <!-- Prominent 2-letter Adobe-style monogram -->
  <g fill="url(#textGrad)" filter="url(#textShadow)">
      <path d="M727 -25Q427 -25 235.0 170.0Q43 365 43 678V758Q43 1071 236.0 1264.5Q429 1458 727 1458Q829 1458 919.5 1430.0Q1010 1402 1080.0 1351.0Q1150 1300 1226 1200Q1236 1189 1235.5 1176.0Q1235 1163 1226 1155L1020 971Q1011 963 999.5 964.0Q988 965 980 972Q934 1034 899.5 1059.5Q865 1085 824.5 1098.5Q784 1112 733 1112Q596 1112 504.5 1022.0Q413 932 413 782V653Q413 504 504.0 412.5Q595 321 732 321Q785 321 829.5 338.0Q874 355 911.5 384.5Q949 414 992 474Q1000 484 1011.5 485.0Q1023 486 1033 479L1245 305Q1255 297 1256.0 284.5Q1257 272 1249 261Q1170 146 1096.0 90.5Q1022 35 929.5 5.0Q837 -25 727 -25Z" transform="translate(102.98,792.00) scale(0.30278,-0.30278)"/>
      <path d="M541 -26Q315 -26 175.0 119.0Q35 264 35 496V549Q35 783 175.5 927.0Q316 1071 544 1071Q714 1071 828.0 990.5Q942 910 994 755Q998 744 994.0 734.0Q990 724 979 720L753 640Q744 636 735.5 639.0Q727 642 722 650Q698 718 655.5 750.0Q613 782 552 782Q467 782 410.5 722.0Q354 662 354 562V484Q354 384 410.5 323.5Q467 263 551 263Q613 263 657.5 298.0Q702 333 725 401Q729 408 737.5 411.0Q746 414 755 411L982 336Q993 333 997.5 322.5Q1002 312 998 301Q949 142 831.0 58.0Q713 -26 541 -26Z" transform="translate(473.17,792.00) scale(0.30278,-0.30278)"/>
  </g>
</svg>
