<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ccCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#114328"/>
      <stop offset="55%" stop-color="#0E311F"/>
      <stop offset="100%" stop-color="#0D291C"/>
    </linearGradient>

    <radialGradient id="ccWash" cx="80%" cy="88%" r="68%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4DD37E"/>
      <stop offset="100%" stop-color="#1FBE5A"/>
    </linearGradient>

    <linearGradient id="monoInk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#62DA8E"/>
      <stop offset="48%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <clipPath id="squircleClip">
